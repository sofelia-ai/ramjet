name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux exercises the io_uring backend, macOS the kqueue one. Both are
        # real backends with their own bugs; testing one proves little about
        # the other.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets

  fuzz:
    name: fuzzer soak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Longer than the in-suite budget. This is the gate that has caught
      # cross-connection data disclosure, a stranded-op hang, and a kernel bug.
      - run: cargo test --release --test fuzz_driver
        env:
          RAMJET_FUZZ_STEPS: 2000
          RAMJET_FUZZ_CASES: 100
      - run: cargo test --release -p ramjet-ws
        env:
          RAMJET_WS_FUZZ_CASES: 10000

  conformance:
    name: Autobahn (ws + wss)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --example ws_echo --example wss_echo
      - run: ./scripts/gen-certs.sh

      - name: ws:// — 517 cases, 0 failures
        run: |
          ./target/release/examples/ws_echo 9001 &
          sleep 2
          docker run --rm --network host \
            -v "$PWD/autobahn/config:/config:ro" \
            -v "$PWD/autobahn/reports:/reports" \
            crossbario/autobahn-testsuite \
            wstest -m fuzzingclient -s /config/fuzzingclient-ci.json
          python3 scripts/check-autobahn.py autobahn/reports/index.json

      - name: wss:// — same suite over TLS 1.3
        run: |
          pkill -x ws_echo || true
          ./target/release/examples/wss_echo 9002 &
          sleep 2
          docker run --rm --network host \
            -v "$PWD/autobahn/config:/config:ro" \
            -v "$PWD/autobahn/reports:/reports" \
            crossbario/autobahn-testsuite \
            wstest -m fuzzingclient -s /config/fuzzingclient-wss-ci.json
          python3 scripts/check-autobahn.py autobahn/reports/index.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autobahn-reports
          path: autobahn/reports/
